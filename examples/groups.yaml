# groups.yaml — canonical scanlation-group registry (example).
#
# KEYED BY canonical OPAQUE UUID. Each entry has human-readable `aliases` and
# per-source NATIVE ids. Mangarr resolves a chapter's group to one of these
# canonical ids, then quality profiles (profiles.yaml) reference them.
#
# Native id lookup:
#   comix    -> numeric group id (GroupID, used as ?group_id=)
#   mangadex -> scanlation group uuid (future)
#   atsumaru -> NO id needed: atsumaru group ids are scoped per-manga, so the
#              atsumaru resolver bridges the chapter's scoped id -> scanlator
#              NAME -> this registry's aliases. Just list the group name under
#              `aliases`; do not fill `sources.atsumaru`.
#
# This is the USER'S preference set (2026-09-18): prefer Flame > O Translations
# > Asura > Lagoon Scans > Webtoon > Thunder; hard-ignore Demonic + Hades Scans.
version: 1

groups:
  d4edcab7-4261-44ee-bf3f-85478184e56f:
    aliases: [ "Flame" ]
    sources: { }

  63076ab7-0d09-44a1-bd3f-05213f65b6f3:
    aliases: [ "O Translations" ]
    sources:
      comix: "2394"

